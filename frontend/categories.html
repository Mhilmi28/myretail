<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori - Myretail</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="dashboard" id="dashboardRoot" hidden>

    <!-- ===== SIDEBAR ===== -->
    <aside class="dashboard__sidebar">
      <div class="dashboard__brand">
        <img src="assets/icon-store.svg" alt="" class="dashboard__brand-logo">
        <span>Myretail</span>
      </div>

      <ul class="sidebar-nav">
        <li data-roles="owner,cashier">
          <a href="#" class="sidebar-nav__link" id="navHome">
            <span class="sidebar-nav__icon">🏠</span>
            <span class="sidebar-nav__label">Dashboard</span>
          </a>
        </li>
        <li data-roles="owner,cashier">
          <a href="pos.html" class="sidebar-nav__link">
            <span class="sidebar-nav__icon">🛒</span>
            <span class="sidebar-nav__label">Kasir (POS)</span>
          </a>
        </li>
        <li data-roles="owner,cashier">
          <a href="products.html" class="sidebar-nav__link">
            <span class="sidebar-nav__icon">📦</span>
            <span class="sidebar-nav__label">Produk</span>
          </a>
        </li>
        <li data-roles="owner">
          <a href="categories.html" class="sidebar-nav__link is-active">
            <span class="sidebar-nav__icon">🏷️</span>
            <span class="sidebar-nav__label">Kategori</span>
          </a>
        </li>
        <li data-roles="owner,cashier">
          <a href="transactions.html" class="sidebar-nav__link">
            <span class="sidebar-nav__icon">🧾</span>
            <span class="sidebar-nav__label">Riwayat Transaksi</span>
          </a>
        </li>
        <li data-roles="owner">
          <a href="debts.html" class="sidebar-nav__link">
            <span class="sidebar-nav__icon">💳</span>
            <span class="sidebar-nav__label">Piutang</span>
          </a>
        </li>
        <li data-roles="owner">
          <a href="expenses.html" class="sidebar-nav__link">
            <span class="sidebar-nav__icon">💸</span>
            <span class="sidebar-nav__label">Biaya Operasional</span>
          </a>
        </li>
        <li data-roles="owner">
          <a href="reports.html" class="sidebar-nav__link">
            <span class="sidebar-nav__icon">📈</span>
            <span class="sidebar-nav__label">Laporan</span>
          </a>
        </li>
        <li data-roles="owner">
          <a href="users.html" class="sidebar-nav__link">
            <span class="sidebar-nav__icon">👥</span>
            <span class="sidebar-nav__label">Manajemen User</span>
          </a>
        </li>
      </ul>

      <button type="button" class="dashboard__logout" id="logoutBtn">
        Log out
      </button>
    </aside>

    <!-- ===== TOPBAR ===== -->
    <header class="dashboard__topbar">
      <h1 class="dashboard__page-title">Kategori</h1>

      <div class="dashboard__user">
        <div class="dashboard__user-info">
          <div class="dashboard__user-name" id="userName">-</div>
          <span class="dashboard__user-role">Owner</span>
        </div>
        <div class="dashboard__avatar" id="userAvatar">-</div>
      </div>
    </header>

    <!-- ===== CONTENT ===== -->
    <main class="dashboard__content">
      <div class="toolbar">
        <div class="toolbar__spacer"></div>
        <button type="button" class="btn btn--solid" id="addCategoryBtn">
          + Tambah Kategori
        </button>
      </div>

      <section class="panel">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nama Kategori</th>
              </tr>
            </thead>
            <tbody id="categoryTableBody">
              <tr>
                <td>
                  <div class="empty-state">
                    <span class="empty-state__title">Memuat data...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

  </div>

  <!-- ===== MODAL: Tambah Kategori (POST /categories) ===== -->
  <div class="modal-overlay" id="categoryModalOverlay" hidden>
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title">Tambah Kategori</h2>
        <button type="button" class="modal__close" id="closeCategoryModalBtn">✕</button>
      </div>

      <form id="categoryForm">
        <div class="modal__body">
          <p class="field__error" id="categoryFormError" style="display:none;"></p>

          <div class="field">
            <label class="field__label" for="categoryName">Nama Kategori</label>
            <input type="text" id="categoryName" class="input" required>
            <span class="field__error" id="categoryNameError"></span>
          </div>
        </div>

        <div class="modal__footer">
          <button type="button" class="btn btn--ghost" id="cancelCategoryBtn">Batal</button>
          <button type="submit" class="btn btn--solid" id="saveCategoryBtn">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- External JS -->
  <script src="js/config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
